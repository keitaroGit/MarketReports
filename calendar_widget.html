<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Economic Calendar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'IBM Plex Sans', sans-serif; background: #0a0e17; color: #e0e8f0; padding: 16px; font-size: 13px; }

  .header { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .title { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: #4a9eff; letter-spacing: 0.08em; text-transform: uppercase; }
  .controls { display: flex; align-items: center; gap: 8px; }
  .lang-btn { font-family: 'IBM Plex Mono', monospace; font-size: 10px; padding: 3px 10px; border-radius: 2px; border: 1px solid #1e2a3a; background: transparent; color: #6b7f96; cursor: pointer; transition: all 0.15s; }
  .lang-btn.active { background: #4a9eff; color: #fff; border-color: #4a9eff; }

  .day-group { margin-bottom: 20px; }
  .day-header { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; color: #4a5a6e; text-transform: uppercase; letter-spacing: 0.1em; padding: 6px 0; border-bottom: 1px solid #1e2a3a; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .day-header.today { color: #4a9eff; border-color: #4a9eff; }
  .today-badge { font-size: 9px; background: #4a9eff; color: #fff; padding: 1px 6px; border-radius: 2px; }
  .holiday-badge { font-size: 9px; background: #2a3a50; color: #6b7f96; padding: 1px 6px; border-radius: 2px; }

  .event-card { background: #0f1724; border: 1px solid #1a2535; border-radius: 4px; padding: 12px 14px; margin-bottom: 8px; transition: border-color 0.15s; }
  .event-card:hover { border-color: #2a3a50; }
  .event-card.high { border-left: 3px solid #f59e0b; }
  .event-card.medium { border-left: 3px solid #3b82f6; }
  .event-card.low { border-left: 3px solid #2a3a50; }
  .event-card.holiday { border-left: 3px solid #374151; opacity: 0.6; }

  .event-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .event-name { font-size: 12px; font-weight: 600; color: #c0ccd8; flex: 1; }
  .event-time { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #4a5a6e; white-space: nowrap; }

  .event-data { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  .data-item { display: flex; flex-direction: column; gap: 2px; }
  .data-label { font-family: 'IBM Plex Mono', monospace; font-size: 8px; text-transform: uppercase; letter-spacing: 0.08em; color: #3a4a5e; }
  .data-value { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: #8a9ab0; }
  .data-value.actual-beat { color: #22c55e; }
  .data-value.actual-miss { color: #f87171; }
  .data-value.actual-inline { color: #fbbf24; }
  .data-value.pending { color: #3a4a5e; }

  .diff-badge { font-size: 9px; font-family: 'IBM Plex Mono', monospace; padding: 1px 5px; border-radius: 2px; margin-left: 4px; }
  .diff-badge.pos { background: #14532d; color: #86efac; }
  .diff-badge.neg { background: #7f1d1d; color: #fca5a5; }

  .event-desc { font-size: 11px; color: #4a5a6e; line-height: 1.6; border-top: 1px solid #1a2535; padding-top: 8px; }

  .imp-dot { display: inline-flex; gap: 2px; align-items: center; }
  .dot { width: 5px; height: 5px; border-radius: 50%; }
  .dot.fill { background: #f59e0b; }
  .dot.fill.blue { background: #3b82f6; }
  .dot.empty { background: #1e2a3a; }

  .footer { margin-top: 16px; font-size: 9px; color: #2a3a50; font-family: 'IBM Plex Mono', monospace; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; }

  .no-events { text-align: center; padding: 30px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #2a3a50; }
</style>
</head>
<body>
<div id="app"><div style="text-align:center;padding:40px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#2a3a50;">LOADING...</div></div>

<script>
const DATA_URL = 'https://marketreports-production.up.railway.app/api/calendar';
let lang = 'en';
let cachedData = null;

const LABELS = {
  en: {
    title: 'ECONOMIC CALENDAR — LATEST RELEASES',
    forecast: 'FORECAST',
    actual: 'ACTUAL',
    previous: 'PREV',
    pending: 'TBD',
    today: 'TODAY',
    holiday: 'HOLIDAY',
    updated: 'Updated',
    source: 'Source: Investing.com',
    noEvents: 'No events scheduled',
  },
  ja: {
    title: '経済カレンダー — 最新指標',
    forecast: '予想',
    actual: '結果',
    previous: '前回',
    pending: '未発表',
    today: '本日',
    holiday: '祝日',
    updated: '更新',
    source: 'データ元：Investing.com',
    noEvents: '予定なし',
  }
};

function importanceDots(level, high) {
  const color = high ? 'fill' : 'fill blue';
  if (level === 3) return `<span class="imp-dot"><span class="dot ${color}"></span><span class="dot ${color}"></span><span class="dot ${color}"></span></span>`;
  if (level === 2) return `<span class="imp-dot"><span class="dot ${color}"></span><span class="dot ${color}"></span><span class="dot empty"></span></span>`;
  return `<span class="imp-dot"><span class="dot ${color}"></span><span class="dot empty"></span><span class="dot empty"></span></span>`;
}

function parseNum(s) {
  if (!s) return null;
  return parseFloat(s.replace(/[^0-9.\-]/g, ''));
}

function diffBadge(actual, forecast, previous) {
  const a = parseNum(actual);
  const f = parseNum(forecast);
  const p = parseNum(previous);
  if (a === null) return '';
  const ref = f !== null ? f : p;
  if (ref === null) return '';
  const diff = a - ref;
  if (Math.abs(diff) < 0.001) return '';
  const sign = diff > 0 ? '+' : '';
  const cls = diff > 0 ? 'pos' : 'neg';
  const val = Math.abs(diff) < 1 ? diff.toFixed(1) : diff.toFixed(0);
  return `<span class="diff-badge ${cls}">${sign}${val}</span>`;
}

function actualClass(actual, forecast, previous) {
  const a = parseNum(actual);
  const f = parseNum(forecast);
  const p = parseNum(previous);
  if (a === null) return 'pending';
  const ref = f !== null ? f : p;
  if (ref === null) return '';
  if (Math.abs(a - ref) < 0.05) return 'actual-inline';
  return a > ref ? 'actual-beat' : 'actual-miss';
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}

function isToday(dateStr) {
  const today = new Date();
  const d = new Date(dateStr + 'T00:00:00');
  return today.toDateString() === d.toDateString();
}

function render(data) {
  const t = LABELS[lang];
  const now = new Date().toLocaleString('en-US', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});

  // Group by date
  const groups = {};
  data.events.forEach(e => {
    if (!groups[e.date]) groups[e.date] = [];
    groups[e.date].push(e);
  });

  const dates = Object.keys(groups).sort();

  const html = dates.map(date => {
    const today = isToday(date);
    const dayLabel = formatDate(date);
    const dayHeaderClass = today ? 'day-header today' : 'day-header';
    const badge = today ? `<span class="today-badge">${t.today}</span>` : '';

    const cards = groups[date].map(e => {
      const isHoliday = e.importance === 1 && e.name.toLowerCase().includes('holiday');
      const cardClass = isHoliday ? 'event-card holiday' : e.importance === 3 ? 'event-card high' : e.importance === 2 ? 'event-card medium' : 'event-card low';
      const name = lang === 'ja' ? e.name_ja : e.name;
      const desc = lang === 'ja' ? e.desc_ja : e.desc_en;
      const dots = isHoliday ? '' : importanceDots(e.importance, e.importance === 3);

      const hasData = e.forecast || e.actual || e.previous;
      let dataSection = '';
      if (hasData && !isHoliday) {
        const actClass = actualClass(e.actual, e.forecast, e.previous);
        const badge = e.actual ? diffBadge(e.actual, e.forecast, e.previous) : '';
        dataSection = `<div class="event-data">
          ${e.forecast ? `<div class="data-item"><div class="data-label">${t.forecast}</div><div class="data-value">${e.forecast}</div></div>` : ''}
          <div class="data-item">
            <div class="data-label">${t.actual}</div>
            <div class="data-value ${actClass}">${e.actual ? e.actual + badge : t.pending}</div>
          </div>
          ${e.previous ? `<div class="data-item"><div class="data-label">${t.previous}</div><div class="data-value">${e.previous}</div></div>` : ''}
        </div>`;
      }

      return `<div class="${cardClass}">
        <div class="event-top">
          <div class="event-name">${dots} ${name}</div>
          <div class="event-time">${e.time}</div>
        </div>
        ${dataSection}
        <div class="event-desc">${desc}</div>
      </div>`;
    }).join('');

    return `<div class="day-group">
      <div class="${dayHeaderClass}">${dayLabel} ${badge}</div>
      ${cards}
    </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="title">${t.title}</div>
      <div class="controls">
        <button class="lang-btn ${lang==='en'?'active':''}" onclick="setLang('en')">EN</button>
        <button class="lang-btn ${lang==='ja'?'active':''}" onclick="setLang('ja')">JA</button>
      </div>
    </div>
    ${html || `<div class="no-events">${t.noEvents}</div>`}
    <div class="footer">
      <div>${t.source}</div>
      <div>${t.updated} ${now}</div>
    </div>
  `;
}

function setLang(l) { lang = l; if (cachedData) render(cachedData); }

async function load() {
  try {
    const res = await fetch(DATA_URL);
    cachedData = await res.json();
    render(cachedData);
  } catch(e) {
    document.getElementById('app').innerHTML = '<div style="text-align:center;padding:20px;color:#f87171;font-family:IBM Plex Mono,monospace;font-size:11px;">Failed to load calendar data</div>';
  }
}

load();
</script>
</body>
</html>
