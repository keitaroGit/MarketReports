version: '3.8'

services:
  market-reports:
    build: .
    container_name: market-reports-dashboard
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - FRED_API_KEY=${FRED_API_KEY}
      - NEWSAPI_KEY=${NEWSAPI_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - HOST=0.0.0.0
      - PORT=5000
    volumes:
      - ./cache:/app/cache
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - market-reports-net

networks:
  market-reports-net:
    driver: bridge
