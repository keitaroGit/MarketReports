<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FedWatch</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'IBM Plex Sans', sans-serif; background: #0a0e17; color: #e0e8f0; padding: 16px; min-height: 100vh; }
  .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #1e2a3a; }
  .title { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: #4a9eff; letter-spacing: 0.1em; text-transform: uppercase; }
  .current-rate { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6b7f96; }
  .current-rate span { color: #e0e8f0; font-weight: 600; }
  .chart-section { margin-bottom: 20px; }
  .chart-label { font-size: 10px; color: #4a5a6e; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; font-family: 'IBM Plex Mono', monospace; }
  .bars { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: flex; align-items: center; gap: 10px; opacity: 0; transform: translateX(-10px); transition: opacity 0.4s ease, transform 0.4s ease; }
  .bar-row.visible { opacity: 1; transform: translateX(0); }
  .bar-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #6b7f96; width: 58px; flex-shrink: 0; text-align: right; }
  .bar-track { flex: 1; height: 20px; background: #111827; border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 2px; width: 0%; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
  .bar-value { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; width: 32px; flex-shrink: 0; color: #4a9eff; }
  .table-section { border: 1px solid #1e2a3a; border-radius: 4px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  thead { background: #111827; }
  th { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: #4a5a6e; padding: 8px 10px; text-align: right; border-bottom: 1px solid #1e2a3a; }
  th:first-child { text-align: left; }
  tbody tr { border-bottom: 1px solid #111827; transition: background 0.15s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #0f1724; }
  td { padding: 8px 10px; text-align: right; font-family: 'IBM Plex Mono', monospace; color: #8a9ab0; }
  td:first-child { text-align: left; color: #c0ccd8; font-weight: 600; }
  .cuts-cell { color: #4a9eff; font-weight: 600; }
  .rate-cell { color: #7ab0e0; }
  .diff-cell { color: #f87171; }
  .footer { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
  .source { font-size: 9px; color: #2a3a50; font-family: 'IBM Plex Mono', monospace; }
  .updated { font-size: 9px; color: #2a3a50; font-family: 'IBM Plex Mono', monospace; }
  .loading { text-align: center; padding: 40px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #2a3a50; letter-spacing: 0.1em; }
  .error { text-align: center; padding: 20px; font-size: 11px; color: #f87171; font-family: 'IBM Plex Mono', monospace; }
  .max-cuts { font-size: 9px; color: #2a3a50; font-family: 'IBM Plex Mono', monospace; text-align: right; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="app"><div class="loading">LOADING FEDWATCH DATA...</div></div>
<script>
const API = 'https://marketreports-production.up.railway.app/api/fedwatch';
function getBarColor(cuts) {
  if (cuts >= 3) return 'linear-gradient(90deg, #1a6b3a, #22c55e)';
  if (cuts >= 2) return 'linear-gradient(90deg, #1a4a6b, #4a9eff)';
  if (cuts >= 1) return 'linear-gradient(90deg, #2a3a6b, #818cf8)';
  return 'linear-gradient(90deg, #2a2a3a, #6b7280)';
}
async function load() {
  try {
    const res = await fetch(API);
    const data = await res.json();
    render(data);
  } catch(e) {
    document.getElementById('app').innerHTML = '<div class="error">Failed to load data</div>';
  }
}
function render(data) {
  const meetings = data.meetings;
  const maxCuts = Math.max(...meetings.map(m => m.cumulative_cuts));
  const now = new Date().toLocaleString('en-US', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
  const barsHTML = meetings.map((m, i) => '<div class="bar-row" id="bar-' + i + '"><div class="bar-label">' + m.label.replace(' 2026','') + '</div><div class="bar-track"><div class="bar-fill" id="fill-' + i + '" style="background:' + getBarColor(m.cumulative_cuts) + '"></div></div><div class="bar-value">' + m.cumulative_cuts.toFixed(1) + 'x</div></div>').join('');
  const rowsHTML = meetings.map(m => '<tr><td>' + m.label + '</td><td class="rate-cell">' + m.implied_rate.toFixed(3) + '%</td><td class="diff-cell">-' + m.rate_diff.toFixed(3) + '%</td><td class="cuts-cell">' + m.cumulative_cuts.toFixed(2) + 'x</td></tr>').join('');
  document.getElementById('app').innerHTML = '<div class="header"><div class="title">FedWatch — FF Futures</div><div class="current-rate">Current FFR <span>' + data.current_rate + '%</span></div></div><div class="chart-section"><div class="chart-label">Cumulative cuts priced in</div><div class="max-cuts">Max: ' + maxCuts.toFixed(2) + 'x &nbsp; (1x = -0.25%)</div><div class="bars">' + barsHTML + '</div></div><div class="table-section"><table><thead><tr><th>Meeting</th><th>Implied Rate</th><th>vs Current</th><th>Cum. Cuts</th></tr></thead><tbody>' + rowsHTML + '</tbody></table></div><div class="footer"><div class="source">Source: Yahoo Finance (ZQ Futures)</div><div class="updated">Updated ' + now + '</div></div>';
  setTimeout(() => {
    meetings.forEach((m, i) => {
      const pct = (m.cumulative_cuts / maxCuts) * 100;
      setTimeout(() => {
        document.getElementById('bar-' + i)?.classList.add('visible');
        setTimeout(() => {
          const fill = document.getElementById('fill-' + i);
          if (fill) fill.style.width = pct + '%';
        }, 100);
      }, i * 80);
    });
  }, 100);
}
load();
</script>
</body>
</html>
